name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Shukebeta.Api.Framework.csproj

      - name: Test
        run: dotnet test tests/Api.Framework.Tests/Api.Framework.Tests.csproj --no-restore

      - name: Pack
        run: dotnet pack src/Shukebeta.Api.Framework.csproj --no-restore -c Release -o ./nupkg

      - name: Push to NuGet.org
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
